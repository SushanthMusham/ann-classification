[project]
name = "ann-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DORAEMONlovesMICHAN", email = "mushamsushanth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.65.0",
    "tensorboard>=2.21.0",
    "tensorflow>=2.21.0",
]

[project.scripts]
ann-classification = "ann_classification:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
